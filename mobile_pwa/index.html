<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101725">
<meta name="format-detection" content="telephone=no">
<title>大肥鱼</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --sat:max(env(safe-area-inset-top), 44px);
  --sab:env(safe-area-inset-bottom);
  --vvh:100dvh; --vvt:0px;
  --bg:#101725; --panel:#182133; --panel2:#1e2a40; --line:#26344e;
  --txt:#eaf1ff; --dim:#8fa3c4; --blue:#12b7f5; --me:#2b8cf0;
  --fish:#202c42; --ok:#33d17a; --warn:#ffb454;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,textarea,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
img{display:block}

/* ★ 键盘修复：容器锁在 visualViewport 可见区，键盘弹出只压缩消息区，header 不动 */
#app{position:fixed;left:0;right:0;top:0;height:var(--vvh);
  transform:translateY(var(--vvt));will-change:height,transform;
  display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* ★ 顶部整体下移，避开灵动岛 / 状态栏 */
header{flex:none;padding:calc(var(--sat) + 6px) 12px 8px;background:linear-gradient(180deg,#1c2942,#182133);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:11px;background:#26364f;display:flex;align-items:center;
  justify-content:center;font-size:20px;flex:none;overflow:hidden;border:1px solid #33476a}
.av img{width:100%;height:100%;object-fit:cover}
.hinfo{flex:1;min-width:0}
.hname{font-weight:600;font-size:16px;display:flex;align-items:center;gap:6px}
.hname .lv{font-size:10px;color:#0c2233;background:var(--blue);border-radius:4px;padding:1px 4px;font-weight:700}
.hsign{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.hbtn{width:36px;height:36px;border-radius:10px;background:#22314b;font-size:17px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:#5a6c88;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* 静默重连状态条：只在顶部，不进聊天流 */
#net{flex:none;height:0;overflow:hidden;background:#0d1728;color:var(--dim);font-size:11px;
  display:flex;align-items:center;padding:0 14px;transition:height .18s}
#net.show{height:20px;border-bottom:1px solid var(--line)}

#log{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:12px 10px 8px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.time{align-self:center;color:#6f839f;font-size:11px;margin:2px 0}
.sys{align-self:center;color:var(--dim);font-size:11px;background:#1b2740;padding:4px 10px;border-radius:20px}
.row{display:flex;gap:8px;max-width:88%;align-items:flex-end}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.row .av{width:34px;height:34px;border-radius:9px;font-size:18px}
.bub{padding:9px 12px;border-radius:16px;background:var(--fish);white-space:pre-wrap;
  word-break:break-word;border-bottom-left-radius:5px;min-width:0;max-width:100%;position:relative}
.row.me .bub{background:linear-gradient(135deg,#2b8cf0,#2176d6);border-bottom-left-radius:16px;border-bottom-right-radius:5px}
.bub.img,.bub.stk{padding:4px;background:transparent!important;border-radius:12px}
.bub.img img,.bub.stk img{max-width:190px;max-height:250px;border-radius:10px;object-fit:cover}
.bub.stk img{width:130px;height:130px;object-fit:contain;background:#1b2740}
.bub.voice{display:flex;align-items:center;gap:8px;min-width:96px;cursor:pointer}
.bub.voice .wave{display:flex;gap:2px;align-items:center;height:16px}
.bub.voice .wave i{width:3px;background:currentColor;border-radius:2px;opacity:.85}
.bub.voice .dur{font-size:11px;opacity:.85}
.bub.playing .wave i{animation:wv .6s infinite alternate}
@keyframes wv{from{height:4px}to{height:16px}}
.imgmenu{position:absolute;right:4px;bottom:4px;display:flex;gap:4px;opacity:0;transition:.15s}
.bub:hover .imgmenu,.imgmenu.on{opacity:1}
.imgmenu b{background:#0c1626cc;border-radius:6px;padding:3px 6px;font-size:11px;font-weight:400}

/* 面板 */
#panel{flex:none;height:0;overflow:hidden;background:var(--panel);border-top:1px solid var(--line);transition:height .2s}
#panel.on{height:248px}
.ptabs{height:38px;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--line)}
.ptab{padding:5px 12px;border-radius:14px;font-size:12px;color:var(--dim);background:#152034}
.ptab.on{background:var(--blue);color:#062233;font-weight:600}
.pbody{height:210px;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.grid.em span{font-size:25px;text-align:center;padding:5px 0;border-radius:9px;background:#16223a}
.grid.stk{grid-template-columns:repeat(4,1fr);gap:8px}
.stkcell{position:relative;background:#16223a;border-radius:10px;padding:5px;text-align:center}
.stkcell img{width:100%;aspect-ratio:1;object-fit:contain}
.stkcell .cap{font-size:10px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stkcell .dl{position:absolute;top:3px;right:3px;background:#0c1626cc;border-radius:6px;font-size:11px;padding:2px 5px}
.stkcell .add{position:absolute;top:3px;left:3px;background:#0c1626cc;border-radius:6px;font-size:11px;padding:2px 5px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:6px}
.pgrid button{background:#16223a;border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;
  align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.pgrid button i{font-style:normal;font-size:24px}
.phint{color:var(--dim);font-size:11px;padding:4px 12px}

footer{flex:none;padding:7px 8px calc(var(--sab) + 7px);background:var(--panel);border-top:1px solid var(--line)}
.bar{display:flex;gap:7px;align-items:flex-end}
.ic{width:38px;height:38px;border-radius:11px;background:#22314b;font-size:20px;flex:none}
.ic.on{background:var(--blue);color:#062233}
#txt{flex:1;min-width:0;background:#0f1a2c;border:1px solid var(--line);border-radius:11px;
  padding:9px 11px;outline:none;resize:none;max-height:96px;height:38px;line-height:20px}
#hold{flex:1;display:none;height:38px;border-radius:11px;background:#0f1a2c;border:1px solid var(--line);
  align-items:center;justify-content:center;font-size:14px;color:var(--dim);user-select:none;touch-action:none}
#hold.rec{background:#3a2430;border-color:#a04455;color:#ffd6dc}
#send{display:none;background:var(--blue);color:#062233;font-weight:600;border-radius:11px;
  height:38px;padding:0 14px;flex:none;font-size:14px}
#recov{position:absolute;inset:0;background:#0b1220e8;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;z-index:20}
#recov.on{display:flex}
#recov .mic{width:88px;height:88px;border-radius:50%;background:#2b3d5c;display:flex;align-items:center;
  justify-content:center;font-size:40px;animation:pulse 1s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}

/* 覆盖页 / 资料卡 */
.page{position:absolute;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
.page.on{display:flex}
.phead{flex:none;padding:calc(var(--sat) + 8px) 12px 10px;background:var(--panel);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-weight:600}
.phead button{font-size:20px;width:32px}
.pbody2{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h4{font-size:13px;color:var(--dim);font-weight:500;margin-bottom:8px}
.cover{height:130px;background:linear-gradient(135deg,#1d5b87,#12b7f5 60%,#1a2b46);border-radius:14px 14px 0 0;position:relative}
.cover .bigav{position:absolute;left:16px;bottom:-30px;width:66px;height:66px;border-radius:16px;
  background:#22334d;border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.cover .bigav img{width:100%;height:100%;object-fit:cover}
.prof{padding:38px 14px 14px}
.prof .nm{font-size:19px;font-weight:700}
.prof .sg{color:var(--dim);font-size:12px;margin-top:3px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11px;background:#22314b;color:#b8cbe8;border-radius:20px;padding:3px 9px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:0}
.li i{font-style:normal;font-size:20px;width:26px;text-align:center}
.li .arrow{margin-left:auto;color:var(--dim)}
.btn{background:var(--blue);color:#062233;border-radius:11px;padding:11px;font-weight:600;text-align:center;width:100%}
.btn.ghost{background:#22314b;color:var(--txt)}
.btn.warn{background:#4a2630;color:#ffb4c0}
.inp{width:100%;background:#0f1a2c;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none;margin-bottom:8px}
textarea.inp{min-height:80px;resize:vertical}
.lab{color:var(--dim);font-size:12px;margin:10px 0 5px}
.rowset{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.rowset:last-child{border-bottom:0}
.rowset .r{margin-left:auto;color:var(--dim);font-size:12px}
input[type=range]{width:150px;accent-color:var(--blue)}
.sw{width:44px;height:25px;border-radius:20px;background:#3a4a66;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--blue)}
.sw.on::after{left:22px}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.album img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}

/* 资料卡弹层 */
#sheet{position:absolute;inset:0;z-index:40;background:#050a12a8;display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheetbox{width:100%;background:var(--panel);border-radius:20px 20px 0 0;padding:8px 14px calc(var(--sab) + 16px);
  max-height:86%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
#sheetbox h3{font-size:15px;margin:10px 0 12px;text-align:center}
.sheetitem{padding:13px;border-radius:12px;background:#16223a;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.sheetitem i{font-style:normal;font-size:20px}
.sh-close{width:100%;text-align:center;color:var(--dim);padding:12px;font-size:13px}

dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:16px;
  padding:18px;width:min(90vw,380px)}
dialog::backdrop{background:#050a12b0}
dialog h3{margin-bottom:8px;font-size:16px}
dialog button{width:100%;margin-top:12px}
#toast{position:absolute;left:50%;top:calc(var(--sat) + 60px);transform:translateX(-50%);z-index:60;
  background:#0a1424ee;border:1px solid var(--line);border-radius:20px;padding:9px 16px;font-size:13px;
  opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#toast.on{opacity:1}
/* AI 自主产物标记 / 头像历史 / 动作日志 */
.badge{display:inline-block;font-size:10px;border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.badge.ai{background:#2b4a6b;color:#9fd4ff}
.badge.me{background:#33425c;color:#b8cbe8}
.avhist{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.avhist img{width:56px;height:56px;border-radius:12px;flex:none;object-fit:cover;border:2px solid transparent}
.avhist img.cur{border-color:var(--blue)}
.act{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
.act:last-child{border-bottom:0}
.act .t{color:var(--dim);flex:none;width:46px}
.act .d{color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="hbtn" id="backHead" style="display:none" onclick="closePage()">‹</button>
    <div class="av" id="hav" onclick="openCard()">🐋</div>
    <div class="hinfo" onclick="openCard()">
      <div class="hname"><span id="hname">大肥鱼</span><span class="lv">LV8</span></div>
      <div class="hsign" id="hsign">状态：在线</div>
    </div>
    <span class="dot" id="dot"></span>
    <button class="hbtn" onclick="openPage('settings')">⚙️</button>
  </header>
  <div id="net"><span id="netTxt">就绪</span></div>
  <div id="log"></div>

  <div id="panel">
    <div class="ptabs" id="ptabs"></div>
    <div class="pbody" id="pbody"></div>
  </div>

  <footer>
    <div class="bar">
      <button class="ic" id="voiceBtn" onclick="toggleVoiceMode()">🎤</button>
      <textarea id="txt" rows="1" placeholder="和大肥鱼聊聊…" autocomplete="off"></textarea>
      <button id="hold">按住 说话</button>
      <button class="ic" id="emojiBtn" onclick="togglePanel('emoji')">☺</button>
      <button class="ic" id="plusBtn" onclick="togglePanel('plus')">＋</button>
      <button id="send" onclick="sendText()">发送</button>
    </div>
  </footer>

  <div id="recov">
    <div class="mic">🎙️</div>
    <div id="recTxt">正在录音… 松开发送</div>
    <div style="color:var(--dim);font-size:12px">上滑取消</div>
  </div>
  <div id="toast"></div>

  <!-- 覆盖层放在 #app 内，跟随键盘可见区定位 -->
  <div id="sheet" onclick="if(event.target===this)closeCard()">
    <div id="sheetbox"></div>
  </div>
  <div class="page" id="page-zone"></div>
  <div class="page" id="page-diary"></div>
  <div class="page" id="page-album"></div>
  <div class="page" id="page-settings"></div>
  <div class="page" id="page-profile"></div>
  <div class="page" id="page-avhist"></div>
</div>

<dialog id="dlg">
  <h3>连接超级大脑</h3>
  <div class="lab">Chat Token（电脑端 %APPDATA%\super-brain\chat_token.txt）</div>
  <input class="inp" id="tok" placeholder="chat_token">
  <button class="btn" onclick="saveTok()">连接</button>
</dialog>
<dialog id="edlg">
  <h3>编辑资料</h3>
  <div class="lab">TA 的头像（图片链接，留空用 emoji）</div>
  <input class="inp" id="eav" placeholder="https://...">
  <div class="lab">TA 的昵称</div>
  <input class="inp" id="enm" placeholder="大肥鱼">
  <div class="lab">TA 的个性签名</div>
  <input class="inp" id="esg" placeholder="状态：在线">
  <div class="lab">我的头像（图片链接，留空用默认）</div>
  <input class="inp" id="emy" placeholder="https://...">
  <button class="btn" onclick="saveEdit()">保存</button>
  <button class="btn ghost" onclick="document.getElementById('edlg').close()">取消</button>
</dialog>

<input type="file" id="fileImg" accept="image/*" multiple style="display:none">
<input type="file" id="fileAny" accept="image/*" style="display:none">
<input type="file" id="fileImport" accept=".json" style="display:none">

<script>
/* ============ 本地存储（IndexedDB，聊天记录/图片/表情包持久化） ============ */
const DB={
  _p:null,
  open(){ if(this._p)return this._p;
    this._p=new Promise((res,rej)=>{
      const r=indexedDB.open('sb_pwa',1);
      r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};
      r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.target.error);
    }); return this._p},
  async get(k,def){try{const d=await this.open();return await new Promise((res,rej)=>{
      const q=d.transaction('kv','readonly').objectStore('kv').get(k);
      q.onsuccess=()=>res(q.result===undefined?def:q.result);q.onerror=()=>rej(q.error)})}
    catch(e){return def}},
  async set(k,v){try{const d=await this.open();return await new Promise((res,rej)=>{
      const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);
      t.oncomplete=()=>res(v);t.onerror=()=>rej(t.error)})}catch(e){return v}}
};
const LS={
  get(k,d){const v=localStorage.getItem('sb_'+k);return v===null?d:v},
  set(k,v){localStorage.setItem('sb_'+k,v)}
};
/* 资料主存 IndexedDB（含 AI 自绘头像 PNG / 说说 / 日记 / 动作记录），不再只靠易被 iOS 清掉的 localStorage。
   旧版本地资料会在 boot 时自动迁移进 IndexedDB。 */
let PROFILE={avatar:'',myav:'',name:'大肥鱼',sign:'状态：在线',emoji:'🐋',
  avatarMood:'',avatarTs:0,avatarBy:'me',by:'me',updated:0};
function persistProfile(){PROFILE.updated=Date.now();DB.set('profile',PROFILE)}
const store={
  get token(){return LS.get('token','')}, set token(v){LS.set('token',v)},
  get sess(){return LS.get('session','')}, set sess(v){LS.set('session',v)},
  get avatar(){return PROFILE.avatar}, set avatar(v){PROFILE.avatar=v;persistProfile()},
  get myav(){return PROFILE.myav}, set myav(v){PROFILE.myav=v;persistProfile()},
  get name(){return PROFILE.name}, set name(v){PROFILE.name=v;persistProfile()},
  get sign(){return PROFILE.sign}, set sign(v){PROFILE.sign=v;persistProfile()},
  get emoji(){return PROFILE.emoji}, set emoji(v){PROFILE.emoji=v;persistProfile()},
  get sat(){return +LS.get('sat',52)}, set sat(v){LS.set('sat',v)},
  get proactive(){return LS.get('proactive','0')==='1'}, set proactive(v){LS.set('proactive',v?'1':'0')},
  get proMin(){return +LS.get('promin',25)}, set proMin(v){LS.set('promin',v)},
  get stt(){return LS.get('stt','1')==='1'}, set stt(v){LS.set('stt',v?'1':'0')},
  get tts(){return LS.get('tts','0')==='1'}, set tts(v){LS.set('tts',v?'1':'0')},
  /* AI 自主行为 */
  get auto(){return LS.get('auto','1')==='1'}, set auto(v){LS.set('auto',v?'1':'0')},
  get autoMin(){return +LS.get('automin',20)}, set autoMin(v){LS.set('automin',v)},
  get autoProfile(){return LS.get('autoprofile','1')==='1'}, set autoProfile(v){LS.set('autoprofile',v?'1':'0')},
  get autoZone(){return LS.get('autozone','1')==='1'}, set autoZone(v){LS.set('autozone',v?'1':'0')},
  get autoDiary(){return LS.get('autodiary','1')==='1'}, set autoDiary(v){LS.set('autodiary',v?'1':'0')},
  get lockAv(){return LS.get('lockav','0')==='1'}, set lockAv(v){LS.set('lockav',v?'1':'0')}
};
let MSGS=[], STICKERS=[], ZONE=[], DIARY=[], AVATARS=[], ACTLOG=[];
let lastAuto=0,autoBusy=false,autoAt=0,autoAllow=[],autoRetry=0;
const MAXMSG=400;

/* ============ 视觉视口：键盘只压缩消息区，不再把整页顶飞 ============ */
function fitViewport(){
  const vv=window.visualViewport;
  const h=vv?vv.height:window.innerHeight;
  const t=vv?vv.offsetTop:0;
  document.documentElement.style.setProperty('--vvh',h+'px');
  document.documentElement.style.setProperty('--vvt',t+'px');
}
function applySafe(){
  document.documentElement.style.setProperty('--sat','max(env(safe-area-inset-top), '+Math.max(0,store.sat)+'px)');
}
if(window.visualViewport){
  visualViewport.addEventListener('resize',()=>{fitViewport();scrollEnd()});
  visualViewport.addEventListener('scroll',fitViewport);
}
window.addEventListener('orientationchange',()=>setTimeout(fitViewport,300));
window.addEventListener('focusin',()=>setTimeout(fitViewport,250));
fitViewport();applySafe();

/* ============ 工具 ============ */
const $=i=>document.getElementById(i);
function esc(s){const d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1900)}
function hhmm(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function avHtml(who){
  const url=who==='me'?store.myav:store.avatar;
  const emo=who==='me'?'🙂':store.emoji;
  return '<div class="av" data-av="'+who+'">'+(url?'<img src="'+esc(url)+'">':esc(emo))+'</div>'

/* ============ 消息渲染（文本按行拆纵向气泡） ============ */
let lastShownTs=0;
function addTime(ts){
  if(ts-lastShownTs<5*60*1000)return;
  const d=document.createElement('div');d.className='time';d.textContent=hhmm(ts);$('log').appendChild(d);
  lastShownTs=ts;
}
function oneRow(who,inner,cls,first,last,multi){
  const me=who==='me';
  const r=document.createElement('div');r.className='row'+(me?' me':'');
  r.innerHTML=first?avHtml(who):'<div class="av" style="visibility:hidden"></div>';
  const b=document.createElement('div');b.className='bub'+(cls?' '+cls:'');
  if(multi){
    if(first)b.style.borderBottomLeftRadius=me?'16px':'5px';
    if(first)b.style.borderBottomRightRadius=me?'5px':'16px';
    if(last)b.style.borderTopLeftRadius=me?'5px':'16px';
    if(last)b.style.borderTopRightRadius=me?'16px':'5px';
  }
  b.innerHTML=inner;r.appendChild(b);$('log').appendChild(r);return b;
}
function renderMsg(m){
  addTime(m.ts||Date.now());
  const who=m.who||'fish';
  if(m.kind==='text'){
    const lines=String(m.text||'').split(/\n+/).filter(x=>x.trim());
    if(!lines.length)lines.push('');
    const n=lines.length;
    lines.forEach((ln,i)=>oneRow(who,esc(ln),'',i===0,i===n-1,n>1));
  }else if(m.kind==='image'||m.kind==='sticker'){
    const cls=m.kind==='sticker'?'stk':'img';
    const menu='<div class="imgmenu"><b data-act="save">＋收藏</b><b data-act="dl">⬇下载</b></div>';
    const b=oneRow(who,'<img src="'+esc(m.src)+'" alt="图片">'+menu,cls,true,true,false);
    b.querySelectorAll('.imgmenu b').forEach(x=>x.onclick=e=>{
      e.stopPropagation();
      if(x.dataset.act==='save')saveSticker(m.src,'表情包');
      else download(m.src,'dafeiyu-'+m.ts+'.png');
    });
    b.querySelector('img').onclick=()=>viewImage(m.src);
    if(m.text){
      const r=document.createElement('div');r.className='row'+(who==='me'?' me':'');
      r.innerHTML='<div class="av" style="visibility:hidden"></div>';
      const bb=document.createElement('div');bb.className='bub';bb.textContent=m.text;r.appendChild(bb);$('log').appendChild(r);
    }
  }else if(m.kind==='voice'){
    const bars=Array.from({length:9},(_,i)=>'<i style="height:'+(5+(i*7)%11)+'px"></i>').join('');
    const inner='<span>▶</span><span class="wave">'+bars+'</span><span class="dur">'+esc(m.dur||1)+'″</span>';
    const b=oneRow(who,inner,'voice',true,true,false);
    b.onclick=()=>playVoice(b,m.src);
  }else if(m.kind==='sys'){
    const d=document.createElement('div');d.className='sys';d.textContent=m.text;$('log').appendChild(d);
  }
}
function playVoice(b,src){
  if(window._au){window._au.pause();window._au=null}
  document.querySelectorAll('.bub.playing').forEach(x=>x.classList.remove('playing'));
  const a=new Audio(src);window._au=a;b.classList.add('playing');
  a.onended=()=>b.classList.remove('playing');
  a.play().catch(()=>{b.classList.remove('playing');toast('语音播放失败')});
}
function speak(t){
  if(!store.tts||!window.speechSynthesis)return;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).slice(0,300));
  u.lang='zh-CN';u.rate=1.05;speechSynthesis.speak(u);
}
function addMsg(m,save=true){
  m.id=m.id||uid();m.ts=m.ts||Date.now();
  MSGS.push(m);
  if(MSGS.length>MAXMSG){
    const cut=MSGS.length-MAXMSG;MSGS.splice(0,cut);
    DB.set('msgs',MSGS);
  }
  renderMsg(m);scrollEnd();
  if(save)DB.set('msgs',MSGS);
  return m;
}
function addSys(t){addMsg({who:'sys',kind:'sys',text:t},false)}

/* ============ 图片压缩 / 下载 / 大图 ============ */
function compress(file,max=1000,q=.72){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{
      let w=im.width,h=im.height;const s=Math.min(1,max/Math.max(w,h));
      w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);
      res(c.toDataURL('image/jpeg',q));
    };im.onerror=rej;im.src=fr.result};
  fr.onerror=rej;fr.readAsDataURL(file);
})}
function download(src,name){
  const a=document.createElement('a');a.href=src;a.download=name||'image.png';
  document.body.appendChild(a);a.click();a.remove();toast('已下载 / 长按图片可存相册');
}

}

/* 自己画圆角矩形：iOS 16.4 以前没有 ctx.roundRect，不能用它，否则启动即白屏 */
function roundRect(g,x,y,w,h,r){
  g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();
}
function makeSticker(emo,txt,bg){
  const c=document.createElement('canvas');c.width=240;c.height=240;const g=c.getContext('2d');
  g.fillStyle=bg;roundRect(g,4,4,232,232,28);g.fill();
  g.font='120px -apple-system,"PingFang SC",sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillText(emo,120,104);
  g.fillStyle='rgba(0,0,0,.32)';roundRect(g,16,172,208,52,16);g.fill();
  g.fillStyle='#fff';g.font='bold 30px -apple-system,"PingFang SC",sans-serif';
  g.fillText(txt,120,199);
  return c.toDataURL('image/png');
}

      if(Array.isArray(d.diary))DIARY=d.diary.slice(0,200);
      if(Array.isArray(d.avatars))AVATARS=d.avatars.slice(0,30);

/* ============ WebSocket（8769 原生协议） ============ */
let ws=null,retry=null,lastActive=Date.now(),lastPro=0;
/* 后端每 session 串行处理，回复顺序与发送顺序一致 → 用队列对账，避免隐藏指令吞掉正常回复。
   mode: '' 正常显示 / 'auto' 解析 AI 自主行为（换头像/签名/说说/日记） / 'silent' 静默回执不进聊天流 */
let hiddenQ=[];
/* 从 AI 回复文本里提取图片链接 / markdown 图片，渲染成真正的图片气泡 */
function extractImages(t){
  const out=[],re=/(data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=]+)|(https?:\/\/[^\s<>")']+\.(?:png|jpe?g|gif|webp|bmp)(?:\?[^\s<>")']*)?)/gi;
  let m;while((m=re.exec(t))&&out.length<4){out.push(m[0])}
  return out;
}
function net(t,show){
  $('netTxt').textContent=t||'就绪';
  $('net').classList.toggle('show',!!show);
}
function dotOn(on){$('dot').className='dot'+(on?' on':'')}
function wsSend(o){if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true}return false}
function connect(){
  if(!store.token){$('dlg').showModal();return}
  if(ws&&(ws.readyState===0||ws.readyState===1))return;
  dotOn(false);net('连接中…',true);
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(proto+'://'+location.host+'/sb/ws');
  ws.onopen=()=>{
    hiddenQ=[];
    ws.send(JSON.stringify({type:'hello',token:store.token,
      session_id:store.sess||undefined,device_id:'iphone-pwa'}));
  };
  ws.onmessage=ev=>{
    let f;try{f=JSON.parse(ev.data)}catch(e){return}
    if(f.type==='hello_ack'){
      dotOn(true);store.sess=f.session_id||store.sess;net('已连接',false);
      maybeBootAuto();
    }else if(f.type==='reply'){
      const txt=f.text||f.content||'(空回复)';
      const hmode=hiddenQ.length?hiddenQ.shift():'';
      if(hmode==='silent'){net('已连接',false);return}
      if(hmode==='auto'){handleAuto(txt);return}
      addMsg({who:'fish',kind:'text',text:txt});speak(txt);net('已连接',false);
      if(Array.isArray(f.images))f.images.forEach(s=>{if(/^(data:image\/|https?:)/.test(s))addMsg({who:'fish',kind:'image',src:s})});
      extractImages(txt).forEach(s=>addMsg({who:'fish',kind:'image',src:s}));
    }else if(f.type==='media_ready'){
      const u=f.url||f.data_url||f.image||'';
      if(u&&/^(data:image\/|https?:|\/)/.test(u))addMsg({who:'fish',kind:'image',src:u});
      else addSys('AI 生成了图片（服务端本机路径，手机端暂不可预览）：'+esc(f.path||''));
    }else if(f.type==='deep_recall_ready'){
      net('想起来一些事…',false);
    }else if(f.type==='typing'){
      if(f.state)net('对方正在输入…',false);
    }else if(f.type==='error'){
      net('错误：'+(f.message||''),true);
      if(String(f.message||'').indexOf('unauthorized')>=0){try{ws.close()}catch(e){};store.token='';$('dlg').showModal()}
    }else if(f.type==='pong'){}
  };
  ws.onclose=()=>{dotOn(false);net('连接断开，静默重连中…',true);
    clearTimeout(retry);retry=setTimeout(connect,3000)};
  ws.onerror=()=>{};
}
function resetToken(){try{ws.close()}catch(e){};$('dlg').showModal()}
function saveTok(){const t=$('tok').value.trim();if(!t)return;store.token=t;$('dlg').close();connect()}
function sendText(text,opt){
  opt=opt||{};
  const t=(text===undefined?$('txt').value:text).trim();
  if(!t)return;
  if(!opt.hidden)addMsg({who:'me',kind:'text',text:t});
  hiddenQ.push(opt.hidden?'silent':'');
  if(!wsSend({type:'message',text:t})){
    hiddenQ.pop();
    if(!opt.hidden)net('未连接，消息已存在本机，连上后可重发',true);
  }
  lastActive=Date.now();

      'SIGN|你此刻想挂的签名\n'+
      'ZONE|此刻想说的一句话，20字以上\n'+
      'DIARY|此刻想记的一段话，40字以上'
    : '（这是你自己的内心记录，不要对主人说，不要寒暄，不要解释，只输出下面这些行，每行都换成你自己的内容，不要照抄）：\n'+
      'MOOD|两个字，此刻感受\n'+
      'SIGN|你想挂在资料卡上的签名\n'+
      'AVATAR_BG|一个颜色，如 #1b5e8a\n'+
      'AVATAR_STICKER|一个emoji\n'+
      'ZONE|一条说说的正文，20~60字，写此刻真实的小事\n'+
      'ZONE_SCENE|night、sea、rain、noon、cozy、work 里选一个\n'+
      'ZONE_CAP|说说卡片上的短句，14字以内\n'+
      'ZONE_STICKER|一个emoji\n'+
      'DIARY|一篇日记正文，40~120字\n'+
      'DIARY_SCENE|night、sea、rain、noon、cozy、work 里选一个\n'+
      'DIARY_CAP|日记卡片上的短句，14字以内';
  /* 双保险：指令里一旦出现媒体触发词，宁可不发，也别再让后端短路成固定回复 */
  if(MEDIA_WORDS.some(w=>prompt.indexOf(w)>=0)){
    logAct('fail','指令含媒体触发词，已拦截未发送');toast('指令被拦截，未发送');return;
  }
  autoBusy=true;autoAt=Date.now();hiddenQ.push('auto');
  if(!wsSend({type:'message',text:prompt})){hiddenQ.pop();autoBusy=false;toast('未连接')}
  else net('TA 正在自己折腾…',false);
}
/* 定时自主触发：不需要主人点，也不需要主人先说话 */
setInterval(()=>{
  if(!store.auto||!ws||ws.readyState!==1||document.hidden||voiceMode)return;
  if(autoBusy&&Date.now()-autoAt<90000)return;
  if(Date.now()-lastAuto<store.autoMin*60000)return;
  const kinds=[];
  if(store.autoProfile)kinds.push('profile');
  if(store.autoZone)kinds.push('zone');
  if(store.autoDiary)kinds.push('diary');
  if(!kinds.length)return;
  lastAuto=Date.now();runAuto(kinds,false);
},30000);

  $('page-settings').querySelectorAll('.sw').forEach(s=>s.onclick=()=>{
    const k=s.dataset.k,on=!s.classList.contains('on');
    s.classList.toggle('on',on);
    const map={proactive:'proactive',stt:'stt',tts:'tts',auto:'auto',
      autoProfile:'autoProfile',autoZone:'autoZone',autoDiary:'autoDiary',lockAv:'lockAv'};
    if(map[k])store[map[k]]=on;
    if(k==='auto'&&on){lastAuto=0;toast('TA 会自己动起来了')}
  });
}
function clearActlog(){ACTLOG=[];DB.set('actlog',ACTLOG);renderSettings();toast('动作记录已清空')}
function rowSwitch(label,key,on){
  return '<div class="rowset"><span>'+esc(label)+'</span><div class="sw'+(on?' on':'')+'" data-k="'+key+'"></div></div>';
}
function newSession(){store.sess='';try{ws.close()}catch(e){};setTimeout(connect,300);closePage();toast('已新建会话')}

/* ============ 启动 ============ */
async function boot(){
  initBuiltin();
  await loadBase();
  MSGS=await DB.get('msgs',[]);
  STICKERS=await DB.get('stickers',[]);
  ZONE=await DB.get('zone',[]);
  DIARY=await DB.get('diary',[]);
  AVATARS=await DB.get('avatars',[]);
  ACTLOG=await DB.get('actlog',[]);
  const p=await DB.get('profile',null);
  if(p&&typeof p==='object'&&!Array.isArray(p))PROFILE=Object.assign(PROFILE,p);
  else{ /* 旧版本地资料迁移进 IndexedDB */
    PROFILE={avatar:LS.get('avatar',''),myav:LS.get('myav',''),
      name:LS.get('name','大肥鱼'),sign:LS.get('sign','状态：在线'),emoji:LS.get('emoji','🐋'),
      avatarMood:'',avatarTs:0,avatarBy:'me',by:'me',updated:Date.now()};
    await DB.set('profile',PROFILE);
  }
  /* 本体形象一次性设为指定头像；之后 AI 自己换的造型变体不会被覆盖 */
  if(LS.get('baseavatar','')!=='3'){
    PROFILE.avatar=BASE_AV;PROFILE.avatarBy='me';PROFILE.avatarTs=Date.now();
    LS.set('baseavatar','3');await DB.set('profile',PROFILE);
  }
  if(!Array.isArray(MSGS))MSGS=[];
  if(!Array.isArray(STICKERS))STICKERS=[];
  if(!Array.isArray(ZONE))ZONE=[];
  if(!Array.isArray(DIARY))DIARY=[];
  if(!Array.isArray(AVATARS))AVATARS=[];
  if(!Array.isArray(ACTLOG))ACTLOG=[];
  scrubJunk();                 /* 开机清掉上一版误发的「好的，正在生成…」垃圾动态 */
  lastAuto=Date.now();          /* 防止首次 30 秒 tick 立刻又触发一轮 */
  $('log').innerHTML='';lastShownTs=0;
  for(const m of MSGS.slice(-MAXMSG))renderMsg(m);
  if(!MSGS.length)addSys('和大肥鱼打个招呼吧～');
  scrollEnd();applyProfile();updSend();
  if(store.token)connect();else $('dlg').showModal();
  setTimeout(fitViewport,400);
}
boot();
</script>
